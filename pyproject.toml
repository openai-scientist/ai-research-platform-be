[project]
name = "ai-research-platform-be"
version = "0.1.0"
description = "Platform API for identity, projects, research inputs, runs, and access control."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.30,<1",
    "boto3>=1.36,<2",
    "cryptography>=44,<51",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "google-cloud-bigquery>=3.30,<4",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.5,<3",
    # 1.2.1 to 1.2.3 fail the first sign-in of a MySQL 8 account made without TLS.
    "pymysql>=1.1.1,<1.2.1",
    "python-multipart>=0.0.18,<1",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
platform-be = "platform_be.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "platform_be"
module-root = "src"

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "moto[s3]>=5.1,<6",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
