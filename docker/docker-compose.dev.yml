name: ai-research-platform-be

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["uvicorn", "platform_be.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload", "--timeout-graceful-shutdown", "30"]
    stop_grace_period: 40s
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://platform:platform-local-only@db:5432/platform}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET:-local-only-session-secret-change-me-32}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-platform_session}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      AUTH_SESSION_RATE_LIMIT: ${AUTH_SESSION_RATE_LIMIT:-10}
      AUTH_CODE_RATE_LIMIT: ${AUTH_CODE_RATE_LIMIT:-20}
      AUTH_SESSION_RATE_WINDOW_SECONDS: ${AUTH_SESSION_RATE_WINDOW_SECONDS:-60}
      REQUEST_MAX_BODY_BYTES: ${REQUEST_MAX_BODY_BYTES:-1048576}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      STORAGE_LOCAL_ROOT: /app/var/storage
      DATASET_MAX_UPLOAD_BYTES: ${DATASET_MAX_UPLOAD_BYTES:-52428800}
      ARTIFACT_MAX_UPLOAD_BYTES: ${ARTIFACT_MAX_UPLOAD_BYTES:-52428800}
      PROJECT_FILE_MAX_UPLOAD_BYTES: ${PROJECT_FILE_MAX_UPLOAD_BYTES:-52428800}
      AVATAR_MAX_UPLOAD_BYTES: ${AVATAR_MAX_UPLOAD_BYTES:-4194304}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-AI Research Platform <no-reply@beyond8.io.vn>}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_OAUTH_CONNECTIONS_REDIRECT_URI: ${GOOGLE_OAUTH_CONNECTIONS_REDIRECT_URI:-}
      GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY:-}
      GOOGLE_PICKER_APP_ID: ${GOOGLE_PICKER_APP_ID:-}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@gmail.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-12345@Abc}
      PROJECT_INVITE_TTL_HOURS: ${PROJECT_INVITE_TTL_HOURS:-24}
      INVITE_RESEND_COOLDOWN_SECONDS: ${INVITE_RESEND_COOLDOWN_SECONDS:-60}
      POPPER_BASE_URL: ${POPPER_BASE_URL:-}
      POPPER_SERVICE_KEY: ${POPPER_SERVICE_KEY:-}
      POPPER_CALLBACK_KEY: ${POPPER_CALLBACK_KEY:-}
      POPPER_TIMEOUT_SECONDS: ${POPPER_TIMEOUT_SECONDS:-30}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      RUN_DEFAULT_BUDGET_USD: ${RUN_DEFAULT_BUDGET_USD:-5}
      RUN_MAX_BUDGET_USD: ${RUN_MAX_BUDGET_USD:-20}
      CONNECTION_SECRET_KEY: ${CONNECTION_SECRET_KEY:-}
      CONNECTION_ALLOW_PRIVATE_HOSTS: ${CONNECTION_ALLOW_PRIVATE_HOSTS:-false}
      CONNECTION_CONNECT_TIMEOUT_SECONDS: ${CONNECTION_CONNECT_TIMEOUT_SECONDS:-10}
      CONNECTION_QUERY_TIMEOUT_SECONDS: ${CONNECTION_QUERY_TIMEOUT_SECONDS:-60}
      CONNECTION_IMPORT_TIMEOUT_SECONDS: ${CONNECTION_IMPORT_TIMEOUT_SECONDS:-300}
      CONNECTION_MAX_CONCURRENT_QUERIES: ${CONNECTION_MAX_CONCURRENT_QUERIES:-4}
      CONNECTION_MAX_CONCURRENT_PER_OWNER: ${CONNECTION_MAX_CONCURRENT_PER_OWNER:-2}
      CONNECTION_PROBE_RATE_LIMIT: ${CONNECTION_PROBE_RATE_LIMIT:-30}
      CONNECTION_QUERY_RATE_LIMIT: ${CONNECTION_QUERY_RATE_LIMIT:-120}
      CONNECTION_PREVIEW_MAX_ROWS: ${CONNECTION_PREVIEW_MAX_ROWS:-100}
      CONNECTION_BIGQUERY_MAX_BYTES_BILLED: ${CONNECTION_BIGQUERY_MAX_BYTES_BILLED:-1073741824}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - ../src:/app/src
      - ../alembic:/app/alembic
      - platform_storage:/app/var/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  platform_db_data:
  platform_storage:
