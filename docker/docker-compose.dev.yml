name: ai-research-platform-be

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["uvicorn", "platform_be.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://platform:platform-local-only@db:5432/platform}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-ai-research-platform-4ceb9}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET:-local-only-session-secret-change-me-32}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-platform_session}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      AUTH_SESSION_RATE_LIMIT: ${AUTH_SESSION_RATE_LIMIT:-10}
      AUTH_SESSION_RATE_WINDOW_SECONDS: ${AUTH_SESSION_RATE_WINDOW_SECONDS:-60}
      REQUEST_MAX_BODY_BYTES: ${REQUEST_MAX_BODY_BYTES:-1048576}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../src:/app/src
      - ../alembic:/app/alembic
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  platform_db_data:
